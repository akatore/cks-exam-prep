# EncryptionConfiguration — encrypt Secrets at rest in etcd
# Place at /etc/kubernetes/enc/encryption-config.yaml
# Then add to kube-apiserver:
#   --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
- resources:
  - secrets
  providers:
  # aescbc — recommended for exam
  - aescbc:
      keys:
      - name: key1
        secret: <base64-encoded-32-byte-key>
        # Generate: head -c 32 /dev/urandom | base64
  # identity fallback — allows reading unencrypted secrets
  - identity: {}
