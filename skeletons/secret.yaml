# Create imperatively:
# kubectl create secret generic db-creds --from-literal=username=admin --from-literal=password=s3cret
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: default
type: Opaque
data:
  username: YWRtaW4=       # echo -n 'admin' | base64
  password: czNjcmV0       # echo -n 's3cret' | base64
---
# Pod consuming the secret
apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.27
    # As environment variables
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: password
    # As a volume mount
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/db-creds
      readOnly: true
  volumes:
  - name: secret-vol
    secret:
      secretName: db-creds
